[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaledger"
version = "0.1.0"
description = "Research integrity layer for AI-generated alpha: point-in-time data, logged hypotheses, trial-adjusted statistics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajvardhan Jadhav" }]
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "statsmodels>=0.14", "mcp>=2.3"]

[project.scripts]
alphaledger-mcp = "alphaledger.gateway.mcp_server:main"

[tool.setuptools.packages.find]
include = ["alphaledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
